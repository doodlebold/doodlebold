# TODO: Windows signing
name: Build and publish release packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# An environment variable because the jobs configure through `cmake --workflow` and ci/ scripts, which take no -D
# (cmake/Version.cmake).
env:
  DOODLEBOLD_RELEASE_VERSION: ${{ github.event.release.tag_name }}

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup
        with:
          platform: windows

      - name: Release build, Qt deployed beside the exe, and its zip
        run: cmake --workflow --preset windows-zip

      - name: Starts, opens a file and quits on a runner that never built it
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/start-windows-package-on-clean-runner.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: doodlebold-windows
          path: build-windows-msvc-release/Doodlebold-*.zip

  rpm:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup
        with:
          platform: fedora

      - name: Release build and its RPM
        run: ci/build-fedora-rpm.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: doodlebold-rpm
          path: build-linux-release/*.rpm

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup
        with:
          platform: appimage

      - name: Release build
        run: ci/build-linux-release-into-appdir.sh

      - name: AppImage
        run: ci/package-appimage.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: doodlebold-appimage
          path: Doodlebold-*.AppImage

  attach:
    if: github.event_name == 'release'
    needs: [windows, rpm, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber -R "${{ github.repository }}"

  # Builds that aren't releases read the last release's version from VERSION (cmake/Version.cmake), so they need no git.
  record-version:
    if: github.event_name == 'release'
    needs: attach
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: The release's version into VERSION on the default branch
        run: ci/record-release-version.sh "${{ github.event.release.tag_name }}"
